[package]
name    = "bitagents"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pin EXACTLY to the backend runtime version; the deploy preflight rejects a mismatch.
aomi-sdk   = "=7.0.0"
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
